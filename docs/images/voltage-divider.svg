<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="500" fill="#ffffff"/>

  <text x="28" y="40" font-size="22" font-weight="700" fill="#111827">Voltage Divider Bias</text>
  <text x="28" y="64" font-size="13" fill="#4b5563">VCC = 12 V   ·   β = 100   ·   VBE = 0.70 V   ·   R1 = 100 kΩ, R2 = 22 kΩ, RC = 2.2 kΩ, RE = 1 kΩ</text>

  <!-- supply and ground rails -->
  <path d="M120 118 H400" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <path d="M120 430 H400" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <circle cx="120" cy="118" r="4" fill="#2563eb"/>
  <circle cx="400" cy="118" r="4" fill="#2563eb"/>
  <text x="80" y="108" font-size="14" font-weight="700" fill="#1d4ed8">VCC = 12 V</text>

  <!-- R1 -->
  <path d="M180 118 V140" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <rect x="170" y="140" width="20" height="70" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
  <path d="M180 210 V262" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <text x="200" y="168" font-size="14" font-weight="700" fill="#111827">R1</text>
  <text x="200" y="186" font-size="13" fill="#4b5563">100 kΩ</text>

  <!-- R2 -->
  <path d="M180 262 V292" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <rect x="170" y="292" width="20" height="70" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
  <path d="M180 362 V430" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <text x="200" y="318" font-size="14" font-weight="700" fill="#111827">R2</text>
  <text x="200" y="336" font-size="13" fill="#4b5563">22 kΩ</text>

  <!-- base node -->
  <path d="M180 262 H320" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <circle cx="180" cy="262" r="4" fill="#2563eb"/>

  <!-- RC -->
  <path d="M400 118 V140" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <rect x="390" y="140" width="20" height="70" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
  <path d="M400 210 V258" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <text x="420" y="168" font-size="14" font-weight="700" fill="#111827">RC</text>
  <text x="420" y="186" font-size="13" fill="#4b5563">2.2 kΩ</text>

  <!-- NPN transistor -->
  <path d="M320 234 V286" stroke="#1f2937" stroke-width="3" fill="none"/>
  <path d="M320 248 L400 258" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <path d="M320 272 L390 328" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <circle cx="400" cy="258" r="4" fill="#2563eb"/>
  <path d="M363 305 L375 315 M375 315 L364 320" stroke="#1f2937" stroke-width="2.2" fill="none"/>
  <text x="292" y="264" font-size="14" font-weight="700" fill="#111827">B</text>
  <text x="376" y="244" font-size="14" font-weight="700" fill="#111827">C</text>
  <text x="410" y="334" font-size="14" font-weight="700" fill="#111827">E</text>
  <text x="230" y="300" font-size="12" fill="#6b7280">β = 100, VBE = 0.70 V</text>
  <text x="330" y="360" font-size="13" font-weight="700" fill="#b91c1c">NPN</text>

  <!-- RE -->
  <path d="M390 328 V360" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <rect x="380" y="360" width="20" height="50" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
  <path d="M390 410 V430" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <text x="420" y="378" font-size="14" font-weight="700" fill="#111827">RE</text>
  <text x="420" y="396" font-size="13" fill="#4b5563">1 kΩ</text>

  <!-- ground -->
  <path d="M180 430 V442 M160 442 H200 M168 448 H192 M176 454 H184" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  <text x="206" y="452" font-size="13" font-weight="700" fill="#111827">GND</text>

  <!-- result panel -->
  <rect x="530" y="112" width="262" height="150" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="548" y="140" font-size="15" font-weight="700" fill="#111827">ผลลัพธ์อ้างอิง (A1)</text>
  <text x="548" y="172" font-size="16" fill="#1d4ed8">IC = 1.23 mA</text>
  <text x="548" y="200" font-size="16" fill="#1d4ed8">VCE = 8.05 V</text>
  <text x="548" y="234" font-size="12" fill="#4b5563">VTH 2.164 V · RTH 18.03 kΩ</text>

  <!-- reference panel -->
  <rect x="530" y="280" width="262" height="170" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="548" y="308" font-size="14" font-weight="700" fill="#111827">สมการที่ใช้</text>
  <text x="548" y="334" font-size="12" fill="#374151">VTH = VCC·R2/(R1+R2) = 2.164 V</text>
  <text x="548" y="356" font-size="12" fill="#374151">RTH = R1·R2/(R1+R2) = 18.03 kΩ</text>
  <text x="548" y="378" font-size="12" fill="#374151">IB = (VTH−VBE)/(RTH+(β+1)·RE)</text>
  <text x="548" y="400" font-size="12" fill="#374151">IC = β·IB = 1.230 mA</text>
  <text x="548" y="422" font-size="12" fill="#374151">VCE = VCC−IC·RC−IE·RE = 8.052 V</text>
  <text x="548" y="442" font-size="11" fill="#6b7280">โมเดล fixed-β, fixed-VBE (ไม่ใช่ SPICE)</text>

  <text x="28" y="482" font-size="11" fill="#9ca3af">Circuit diagram — voltage-divider bias, Lab 03 reference values</text>
</svg>
